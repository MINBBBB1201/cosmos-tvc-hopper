<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 700" font-family="Helvetica,Arial,sans-serif">
  <style>
    .bg{fill:#ffffff}
    .part{fill:#e8eef2;stroke:#2b3a42;stroke-width:1.6}
    .part2{fill:#f4dccd;stroke:#b4551f;stroke-width:1.6}
    .col{stroke:#2b3a42;stroke-width:5;stroke-linecap:round}
    .jet{fill:none;stroke:#b4551f;stroke-width:1.4}
    .dim{stroke:#6a7b84;stroke-width:0.9}
    .dimtxt{fill:#3a4a52;font-size:12px}
    .lbl{fill:#152029;font-size:12.5px}
    .lblb{fill:#152029;font-size:13px;font-weight:bold}
    .cl{stroke:#9aa;stroke-width:0.7;stroke-dasharray:6 3 2 3}
    .title{fill:#152029;font-size:15px;font-weight:bold}
    .note{fill:#4c5c64;font-size:11px}
  </style>
  <rect class="bg" x="0" y="0" width="940" height="700"/>

  <text class="title" x="30" y="30">COSMOS 착륙 호퍼 — 개략 배치도 (rev B · 64mm/4S · 오픈 스탠드오프)  · 단위 mm · 축척 개략</text>
  <text class="note" x="30" y="48">치수 정본 = cad/params.scad. 형상 확정 / 숫자는 실측 후 갱신(설계도 §4·§14). rev A(70mm/6S/PVC)는 폐기.</text>

  <!-- ================= SIDE ELEVATION ================= -->
  <g>
    <text class="lblb" x="120" y="80">측면도</text>
    <line class="cl" x1="255" y1="90" x2="255" y2="640"/>

    <!-- bail -->
    <path class="part" d="M215,150 C215,110 295,110 295,150" fill="none" stroke-width="3"/>
    <circle cx="255" cy="112" r="5" fill="none" stroke="#b4551f" stroke-width="2"/>
    <text class="lbl" x="315" y="120">상단 베일 (Ø3 스틸봉)</text>
    <text class="note" x="315" y="134">손잡이 + M3 텐서 걸이</text>

    <!-- top plate + EDF -->
    <rect class="part2" x="200" y="150" width="110" height="12"/>
    <rect class="part2" x="222" y="162" width="66" height="52"/>
    <path class="jet" d="M230,150 C230,135 240,128 255,128 C270,128 280,135 280,150" />
    <text class="lbl" x="315" y="160">상판 (PETG/합판 4mm) = EDF 마운트</text>
    <text class="lbl" x="315" y="196">64 mm EDF, 4S · 흡기 ▲ / 배기 ▼</text>

    <!-- columns -->
    <line class="col" x1="222" y1="214" x2="222" y2="430"/>
    <line class="col" x1="288" y1="214" x2="288" y2="430"/>
    <text class="lbl" x="70" y="250">기둥 4개</text>
    <text class="note" x="70" y="264">Ø6 CF, 200 mm</text>

    <!-- central tray -->
    <rect class="part" x="212" y="250" width="86" height="110" rx="4"/>
    <line x1="212" y1="290" x2="298" y2="290" stroke="#2b3a42" stroke-width="0.8"/>
    <line x1="212" y1="326" x2="298" y2="326" stroke="#2b3a42" stroke-width="0.8"/>
    <text class="lbl" x="315" y="270">중앙 트레이 (기류 밖) — rev C: Teensy 4.0 기반</text>
    <text class="lbl" x="315" y="286">배터리 4S / Teensy4.0 / BNO085 / ESC / ESP32</text>
    <text class="note" x="315" y="302">세로 슬롯 ±20 = CG 트림</text>

    <!-- CG -->
    <path d="M255,300 l0,16 M247,308 l16,0" stroke="#b4551f" stroke-width="1"/>
    <text class="lblb" x="262" y="296">CG</text>

    <!-- vane ring -->
    <rect class="part2" x="207" y="430" width="96" height="26"/>
    <text class="lbl" x="315" y="446">베인 링 (프린트)</text>

    <!-- vanes -->
    <g stroke="#b4551f" stroke-width="3">
      <line x1="233" y1="458" x2="233" y2="483"/>
      <line x1="277" y1="458" x2="277" y2="483"/>
    </g>
    <text class="lbl" x="315" y="472">베인 ×4 @90°, 배기면 −22, ±15°</text>
    <text class="lbl" x="315" y="488">서보 ×4 (방사, 기류 밖)</text>

    <!-- underslung restraint socket -->
    <rect class="part" x="245" y="456" width="20" height="12"/>
    <circle cx="255" cy="474" r="4" fill="none" stroke="#b4551f" stroke-width="2"/>
    <text class="lbl" x="70" y="410">언더슬렁 M6</text>
    <text class="note" x="70" y="424">삼각대 짐벌 ↔ (CG, 홀 3)</text>

    <!-- jet -->
    <path class="jet" d="M236,456 C238,500 244,560 250,632 M274,456 C272,500 266,560 260,632"/>
    <text class="note" x="262" y="600">제트 ▼</text>

    <!-- legs -->
    <line class="part" x1="255" y1="443" x2="165" y2="600" stroke-width="4"/>
    <line class="part" x1="255" y1="443" x2="345" y2="600" stroke-width="4"/>
    <ellipse class="part" cx="165" cy="606" rx="14" ry="5"/>
    <ellipse class="part" cx="345" cy="606" rx="14" ry="5"/>
    <text class="lbl" x="70" y="470">다리 ×4</text>
    <text class="note" x="70" y="484">Ø6 CF, 스플레이 33°</text>

    <!-- ground -->
    <line x1="120" y1="612" x2="400" y2="612" stroke="#2b3a42" stroke-width="2"/>
    <path d="M130,620 l9,-8 M150,620 l9,-8 M170,620 l9,-8 M190,620 l9,-8 M210,620 l9,-8 M230,620 l9,-8 M250,620 l9,-8 M270,620 l9,-8 M290,620 l9,-8 M310,620 l9,-8 M330,620 l9,-8 M350,620 l9,-8 M370,620 l9,-8" stroke="#6a7b84" stroke-width="0.8"/>

    <!-- dims -->
    <g class="dim">
      <line x1="400" y1="150" x2="400" y2="606"/>
      <line x1="395" y1="150" x2="405" y2="150"/>
      <line x1="395" y1="606" x2="405" y2="606"/>
    </g>
    <text class="dimtxt" x="406" y="380">전체 높이 ≈ 350</text>

    <g class="dim">
      <line x1="360" y1="214" x2="360" y2="430"/>
      <line x1="355" y1="214" x2="365" y2="214"/>
      <line x1="355" y1="430" x2="365" y2="430"/>
    </g>
    <text class="dimtxt" x="366" y="326">기둥 200</text>

    <g class="dim">
      <line x1="355" y1="456" x2="355" y2="606"/>
      <line x1="350" y1="456" x2="360" y2="456"/>
      <line x1="350" y1="606" x2="360" y2="606"/>
    </g>
    <text class="dimtxt" x="361" y="536">배기→발 140</text>

    <g class="dim">
      <line x1="165" y1="628" x2="345" y2="628"/>
      <line x1="165" y1="623" x2="165" y2="633"/>
      <line x1="345" y1="623" x2="345" y2="633"/>
    </g>
    <text class="dimtxt" x="210" y="646">발 원 지름 360</text>

    <text class="note" x="70" y="330">TWR ≈ 1300/650 ≈ 2.0  → 저고도 홉 여유</text>
  </g>

  <!-- ================= BOTTOM VIEW ================= -->
  <g transform="translate(560,0)">
    <text class="lblb" x="140" y="80">저면도 (배기쪽에서)</text>

    <circle cx="180" cy="320" r="110" class="part"/>
    <circle cx="180" cy="320" r="60" fill="#fff" stroke="#2b3a42" stroke-width="1.2"/>
    <circle cx="180" cy="320" r="36" class="jet"/>
    <text class="note" x="152" y="324">제트 코어</text>

    <!-- vanes N E S W -->
    <g fill="#f4dccd" stroke="#b4551f" stroke-width="1.6">
      <rect x="172" y="258" width="14" height="30"/>
      <rect x="172" y="352" width="14" height="30"/>
      <rect x="242" y="313" width="30" height="14"/>
      <rect x="88"  y="313" width="30" height="14"/>
    </g>
    <text class="lbl" x="165" y="248">Fwd</text>
    <text class="lbl" x="163" y="402">Back</text>
    <text class="lbl" x="278" y="324">Right</text>
    <text class="lbl" x="46"  y="324">Left</text>
    <text class="note" x="70" y="452">Roll → Fwd/Back   ·   Pitch → L/R   ·   Yaw → 4핀 캔트(가장 약함)</text>

    <!-- columns (between vanes, 45deg) -->
    <g fill="#2b3a42">
      <circle cx="123" cy="263" r="5"/>
      <circle cx="237" cy="263" r="5"/>
      <circle cx="123" cy="377" r="5"/>
      <circle cx="237" cy="377" r="5"/>
    </g>
    <text class="note" x="240" y="262">기둥 (베인과 45°)</text>

    <!-- servos radial -->
    <g fill="#e8eef2" stroke="#2b3a42" stroke-width="1.2">
      <rect x="170" y="205" width="20" height="12"/>
      <rect x="170" y="423" width="20" height="12"/>
      <rect x="283" y="314" width="12" height="20"/>
      <rect x="65"  y="314" width="12" height="20"/>
    </g>
    <text class="note" x="196" y="214">서보(방사, 기류 밖)</text>

    <!-- legs diagonal, aligned with columns -->
    <g stroke="#2b3a42" stroke-width="4" fill="none">
      <line x1="180" y1="320" x2="105" y2="245"/>
      <line x1="180" y1="320" x2="255" y2="245"/>
      <line x1="180" y1="320" x2="105" y2="395"/>
      <line x1="180" y1="320" x2="255" y2="395"/>
    </g>
    <g fill="#e8eef2" stroke="#2b3a42" stroke-width="1.4">
      <circle cx="105" cy="245" r="9"/>
      <circle cx="255" cy="245" r="9"/>
      <circle cx="105" cy="395" r="9"/>
      <circle cx="255" cy="395" r="9"/>
    </g>

    <!-- underslung -->
    <circle cx="180" cy="320" r="6" fill="none" stroke="#b4551f" stroke-width="2"/>
    <text class="lbl" x="188" y="316">언더슬렁 M6 (삼각대 짐벌)</text>

    <g class="dim">
      <line x1="180" y1="320" x2="290" y2="320"/>
      <line x1="290" y1="315" x2="290" y2="325"/>
    </g>
    <text class="dimtxt" x="205" y="314">베인 링 R</text>

    <text class="note" x="24" y="500">베인은 노즐 축에서 7 mm 안쪽까지 덮어 제트 코어 ~60% 집중(팁 저에너지역 회피).</text>
    <text class="note" x="24" y="516">편향 ±15° = 기계 하드스톱 + SERVOx_MIN/MAX 이중. cad/vane_ring.scad vane_sweep_check()로 간섭 확인.</text>
  </g>
</svg>
